<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b69"/>
    </marker>
    <g id="nav">
      <rect x="0" y="0" width="236" height="46" fill="#e9f0ee"/>
      <text x="29" y="18" font-size="13" text-anchor="middle" fill="#3f4947">◉</text>
      <text x="29" y="36" font-size="9" text-anchor="middle" fill="#3f4947">Monitor</text>
      <text x="88" y="18" font-size="13" text-anchor="middle" fill="#3f4947">≡</text>
      <text x="88" y="36" font-size="9" text-anchor="middle" fill="#3f4947">Historial</text>
      <text x="147" y="18" font-size="13" text-anchor="middle" fill="#3f4947">⇄</text>
      <text x="147" y="36" font-size="9" text-anchor="middle" fill="#3f4947">Teléfonos</text>
      <text x="206" y="18" font-size="13" text-anchor="middle" fill="#3f4947">⚙</text>
      <text x="206" y="36" font-size="9" text-anchor="middle" fill="#3f4947">Ajustes</text>
    </g>
  </defs>
  <style>
    .phone{fill:#ffffff;stroke:#1d2524;stroke-width:6}
    .screen{fill:#f6faf9}
    .brand{font-size:9px;font-weight:700;fill:#006C65;letter-spacing:1px}
    .h1{font-size:15px;font-weight:700;fill:#161d1c}
    .card{fill:#ffffff;stroke:#d5dfdc}
    .t{font-size:10px;fill:#3f4947}
    .tb{font-size:11px;font-weight:700;fill:#161d1c}
    .small{font-size:8.5px;fill:#5f6b69}
    .btn{fill:#006C65}
    .btnt{font-size:10.5px;fill:#ffffff;font-weight:600}
    .obtn{fill:none;stroke:#6f7977}
    .obtnt{font-size:10px;fill:#006C65;font-weight:600}
    .field{fill:#ffffff;stroke:#6f7977}
    .lbl{font-size:13px;font-weight:700;fill:#161d1c}
    .note{font-size:11px;fill:#3f4947}
  </style>

  <rect width="1400" height="700" fill="#fbfcfc"/>
  <text x="40" y="38" font-size="22" font-weight="700" fill="#161d1c">Detector de gas · Mockup de la app Android</text>
  <text x="40" y="60" class="note">Jetpack Compose + Material 3 · Navegación inferior con 4 pestañas después del login · Colores: verde = sin alerta, ámbar = espera/prueba, rojo = alerta</text>

  <!-- 1 LOGIN -->
  <g transform="translate(40,90)">
    <text x="0" y="0" class="lbl">1 · Login (SQLite local)</text>
    <rect x="0" y="12" width="250" height="520" rx="28" class="phone"/>
    <rect x="7" y="40" width="236" height="470" class="screen"/>
    <g transform="translate(7,40)">
      <text x="14" y="22" class="brand">DETECTOR DE GAS</text>
      <text x="14" y="42" class="h1">Tu detector, a mano</text>
      <text x="14" y="62" class="t">Detector y dos teléfonos en la misma</text>
      <text x="14" y="75" class="t">red Wi-Fi. Funciona sin Internet.</text>
      <rect x="10" y="88" width="216" height="200" rx="12" class="card"/>
      <text x="22" y="110" class="tb">Iniciar sesión local</text>
      <rect x="22" y="122" width="192" height="34" rx="4" class="field"/>
      <text x="30" y="143" class="t">Usuario local</text>
      <rect x="22" y="166" width="192" height="34" rx="4" class="field"/>
      <text x="30" y="187" class="t">Contraseña  ••••••••</text>
      <rect x="22" y="212" width="192" height="34" rx="17" class="btn"/>
      <text x="118" y="233" text-anchor="middle" class="btnt">Entrar</text>
      <text x="118" y="270" text-anchor="middle" class="obtnt">Crear una cuenta local</text>
      <text x="14" y="310" class="small">Primera cuenta = administrador;</text>
      <text x="14" y="322" class="small">siguientes = operador.</text>
      <text x="118" y="352" text-anchor="middle" class="obtnt">Explorar con datos simulados</text>
      <text x="14" y="455" class="small">Prototipo educativo · lecturas ADC, no ppm.</text>
    </g>
  </g>

  <!-- 2 MONITOR -->
  <g transform="translate(310,90)">
    <text x="0" y="0" class="lbl">2 · Monitor</text>
    <rect x="0" y="12" width="250" height="520" rx="28" class="phone"/>
    <rect x="7" y="40" width="236" height="470" class="screen"/>
    <g transform="translate(7,40)">
      <text x="14" y="22" class="brand">DETECTOR DE GAS</text>
      <text x="14" y="42" class="h1">Monitoreo</text>
      <rect x="10" y="52" width="216" height="222" rx="12" class="card"/>
      <text x="22" y="72" class="tb">Sensor conectado al ESP32</text>
      <text x="22" y="90" font-size="13" font-weight="700" fill="#B3261E">Alerta del sensor</text>
      <path d="M 66 186 A 54 54 0 1 1 170 186" fill="none" stroke="#e0e9e6" stroke-width="12" stroke-linecap="round"/>
      <path d="M 66 186 A 54 54 0 0 1 128 120" fill="none" stroke="#B3261E" stroke-width="12" stroke-linecap="round"/>
      <text x="118" y="165" text-anchor="middle" font-size="26" font-weight="700" fill="#161d1c">620</text>
      <text x="118" y="180" text-anchor="middle" class="small">ADC / 1023</text>
      <text x="22" y="212" class="small">ESP32 autenticado · Arduino con datos</text>
      <rect x="22" y="226" width="192" height="32" rx="16" class="obtn"/>
      <text x="118" y="246" text-anchor="middle" class="obtnt">Detener monitoreo</text>
      <rect x="10" y="284" width="216" height="98" rx="12" class="card"/>
      <text x="22" y="304" class="tb">Control del detector</text>
      <rect x="22" y="314" width="192" height="32" rx="16" fill="#885200"/>
      <text x="118" y="334" text-anchor="middle" class="btnt">Probar alarma (3 s)</text>
      <text x="22" y="364" class="small">Prueba de alarma enviada · 14:32:05</text>
      <text x="14" y="404" class="small">Emisor · ESP32 → este teléfono → otro Android</text>
    </g>
    <use href="#nav" x="7" y="464"/>
    <rect x="15" y="466" width="45" height="22" rx="11" fill="#b9e8e1" opacity="0.6"/>
  </g>

  <!-- 3 HISTORIAL -->
  <g transform="translate(580,90)">
    <text x="0" y="0" class="lbl">3 · Historial (SQLite)</text>
    <rect x="0" y="12" width="250" height="520" rx="28" class="phone"/>
    <rect x="7" y="40" width="236" height="470" class="screen"/>
    <g transform="translate(7,40)">
      <text x="14" y="22" class="brand">DETECTOR DE GAS</text>
      <text x="14" y="42" class="h1">Historial de lecturas</text>
      <text x="14" y="62" class="small">Últimas 100 lecturas de esta cuenta (máx. 500).</text>
      <text x="14" y="80" class="obtnt">Borrar historial local (solo admin)</text>
      <g class="t">
        <rect x="10" y="92" width="216" height="52" rx="10" class="card"/>
        <text x="22" y="112" class="tb">Alerta del sensor</text>
        <text x="22" y="126" class="small">10/11 14:32:04 · ESP32</text>
        <text x="214" y="122" text-anchor="end" font-size="12" font-weight="700" fill="#B3261E">620 ADC</text>
        <rect x="10" y="152" width="216" height="52" rx="10" class="card"/>
        <text x="22" y="172" class="tb">Prueba manual</text>
        <text x="22" y="186" class="small">10/11 14:31:40 · ESP32</text>
        <text x="214" y="182" text-anchor="end" font-size="12" font-weight="700" fill="#006C65">165 ADC</text>
        <rect x="10" y="212" width="216" height="52" rx="10" class="card"/>
        <text x="22" y="232" class="tb">Sin alerta según el umbral</text>
        <text x="22" y="246" class="small">10/11 14:31:20 · Emisor local</text>
        <text x="214" y="242" text-anchor="end" font-size="12" font-weight="700" fill="#006C65">150 ADC</text>
        <rect x="10" y="272" width="216" height="52" rx="10" class="card"/>
        <text x="22" y="292" class="tb">Sin datos recientes</text>
        <text x="22" y="306" class="small">10/11 14:30:02 · ESP32</text>
        <text x="214" y="302" text-anchor="end" font-size="12" font-weight="700" fill="#006C65">— ADC</text>
        <rect x="10" y="332" width="216" height="52" rx="10" class="card"/>
        <text x="22" y="352" class="tb">Espera inicial</text>
        <text x="22" y="366" class="small">10/11 14:29:55 · SIMULACIÓN</text>
        <text x="214" y="362" text-anchor="end" font-size="12" font-weight="700" fill="#006C65">140 ADC</text>
      </g>
    </g>
    <use href="#nav" x="7" y="464"/>
    <rect x="74" y="466" width="45" height="22" rx="11" fill="#b9e8e1" opacity="0.6"/>
  </g>

  <!-- 4 TELEFONOS -->
  <g transform="translate(850,90)">
    <text x="0" y="0" class="lbl">4 · Teléfonos (2 Android)</text>
    <rect x="0" y="12" width="250" height="520" rx="28" class="phone"/>
    <rect x="7" y="40" width="236" height="470" class="screen"/>
    <g transform="translate(7,40)">
      <text x="14" y="22" class="brand">DETECTOR DE GAS</text>
      <text x="14" y="42" class="h1">Dos teléfonos</text>
      <text x="14" y="60" class="tb">Este teléfono: Pixel 8 · 3f2a</text>
      <rect x="10" y="70" width="216" height="80" rx="12" class="card"/>
      <text x="22" y="90" class="tb">Enlace por Wi-Fi local</text>
      <text x="22" y="106" class="t">Emisor activo · puerto 8765</text>
      <text x="22" y="122" class="t">IP: 192.168.1.20 (wlan0)</text>
      <text x="22" y="138" class="small">Cifrado AES-256-GCM</text>
      <rect x="10" y="160" width="216" height="80" rx="12" class="card"/>
      <text x="22" y="180" class="tb">Solicitar y confirmar una revisión</text>
      <rect x="22" y="192" width="192" height="32" rx="16" class="btn"/>
      <text x="118" y="212" text-anchor="middle" class="btnt">Solicitar revisión</text>
      <rect x="10" y="250" width="216" height="78" rx="12" class="card"/>
      <text x="22" y="270" class="tb">Solicitud recibida</text>
      <text x="22" y="286" class="small">Galaxy A54 · 10/11 14:33:10</text>
      <rect x="22" y="294" width="120" height="26" rx="13" class="btn"/>
      <text x="82" y="311" text-anchor="middle" class="btnt">Confirmar revisión</text>
      <rect x="10" y="338" width="216" height="58" rx="12" class="card"/>
      <text x="22" y="358" class="tb">Solicitud enviada</text>
      <text x="22" y="376" font-size="10" fill="#006C65">Confirmada por Galaxy A54</text>
    </g>
    <use href="#nav" x="7" y="464"/>
    <rect x="133" y="466" width="45" height="22" rx="11" fill="#b9e8e1" opacity="0.6"/>
  </g>

  <!-- 5 AJUSTES -->
  <g transform="translate(1120,90)">
    <text x="0" y="0" class="lbl">5 · Ajustes (administrador)</text>
    <rect x="0" y="12" width="250" height="520" rx="28" class="phone"/>
    <rect x="7" y="40" width="236" height="470" class="screen"/>
    <g transform="translate(7,40)">
      <text x="14" y="22" class="brand">DETECTOR DE GAS</text>
      <text x="14" y="42" class="h1">Configuración</text>
      <rect x="10" y="52" width="216" height="128" rx="12" class="card"/>
      <text x="22" y="72" class="tb">Función de este teléfono</text>
      <circle cx="30" cy="88" r="5" fill="#006C65"/><text x="42" y="92" class="t">Emisor: consulta el ESP32</text>
      <circle cx="30" cy="106" r="5" fill="none" stroke="#6f7977"/><text x="42" y="110" class="t">Receptor: consulta al emisor</text>
      <rect x="22" y="120" width="192" height="28" rx="4" class="field"/>
      <text x="30" y="138" class="t">IP local del ESP32: 192.168.1.50</text>
      <text x="22" y="168" class="obtnt">Guardar dirección</text>
      <rect x="10" y="188" width="216" height="128" rx="12" class="card"/>
      <text x="22" y="208" class="tb">Fuente del sensor</text>
      <circle cx="30" cy="224" r="5" fill="#006C65"/><text x="42" y="228" class="t">ESP32 real del circuito</text>
      <circle cx="30" cy="242" r="5" fill="none" stroke="#6f7977"/><text x="42" y="246" class="t">ESP32 simulado (sin circuito)</text>
      <rect x="22" y="256" width="192" height="28" rx="4" class="field"/>
      <text x="30" y="274" class="t">Clave del ESP32 · 9f3c…a71e</text>
      <text x="22" y="304" class="obtnt">Generar clave nueva</text>
      <rect x="10" y="324" width="216" height="58" rx="12" class="card"/>
      <text x="22" y="344" class="tb">Código de enlace entre teléfonos</text>
      <text x="22" y="364" class="obtnt">Mostrar código · Generar otro</text>
      <rect x="10" y="390" width="216" height="32" rx="12" class="card"/>
      <text x="22" y="410" class="t">admin_1 · administrador · Cerrar sesión</text>
    </g>
    <use href="#nav" x="7" y="464"/>
    <rect x="192" y="466" width="45" height="22" rx="11" fill="#b9e8e1" opacity="0.6"/>
  </g>

  <!-- Navegación -->
  <path d="M 292 330 L 308 330" stroke="#5f6b69" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="660" class="note">Flujo: Login → Monitor (pantalla inicial) · desde la barra inferior se pasa a Historial, Teléfonos y Ajustes · El operador ve Ajustes en solo lectura y no puede enviar "Probar alarma" ni borrar el historial.</text>
  <text x="40" y="680" class="note">Interacción IoT: Monitor consulta el ESP32 cada 2 s y envía órdenes · Teléfonos intercambia lecturas, revisiones y órdenes cifradas con el otro Android.</text>
</svg>
